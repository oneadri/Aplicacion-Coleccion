<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Colección</title>
<meta name="description" content="K-pop, juegos, pelis y series, anime y manga en un solo sitio.">
<meta name="theme-color" content="#0e1016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Colección">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:var(--bg,#0e1016);overflow:auto}
.loginbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;background:var(--surface,#171a23);border:1px solid var(--line,#2a2f3b);border-radius:16px;padding:26px 22px;box-shadow:var(--shadow)}
.loginbox h1{margin:0}
.loginsub{margin:0;color:var(--muted,#9097a9)}
.loginbox label{display:flex;flex-direction:column;gap:4px}
.loginacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.loginacts .btn{flex:1}
.loginmsg{margin:0;max-width:380px;text-align:center;color:var(--muted,#9097a9);min-height:1.5em}
.loginmsg.bad{color:var(--accent,#ff4f8b);font-weight:700}
input[type=email],input[type=password]{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;font:inherit;color:inherit}
.appfoot{max-width:1180px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:.85rem;color:var(--muted)}
.appfoot b{color:var(--fg);font-weight:600}
.sharearea{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.sharearea input{width:min(320px,100%);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:.8rem;color:var(--fg)}
.shareon{color:var(--own);font-weight:700}
.viewnote{color:var(--fg);font-weight:600}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: game-launcher library — dark charcoal shell, cover art as the hero of every card, a blurred-art banner per page; each state has its own color (pink wish, green owned/done, blue playing, amber pending) */
:root{
  --bg:#0e1016; --surface:#171a23; --raised:#1f232e; --sunk:#12141b; --line:#2a2f3b;
  --fg:#eef0f6; --muted:#9097a9;
  --accent:#ff4f8b; --accent-ink:#1a0710; --accent-soft:rgba(255,79,139,.14);
  --own:#3ddc97; --own-soft:rgba(61,220,151,.14);
  --play:#4da3ff; --play-soft:rgba(77,163,255,.14);
  --pend:#ffb547; --pend-soft:rgba(255,181,71,.14);
  --violet:#a78bfa; --star:#ffc93d;
  --glow1:rgba(255,79,139,.13); --glow2:rgba(77,163,255,.12); --glow3:rgba(167,139,250,.08);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -18px rgba(0,0,0,.8);
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --holo:linear-gradient(var(--accent),var(--accent));
  --r:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eceef4; --surface:#ffffff; --raised:#ffffff; --sunk:#f3f4f8; --line:#dcdfe8;
  --fg:#141720; --muted:#5d6477;
  --accent:#e0266b; --accent-ink:#ffffff; --accent-soft:rgba(224,38,107,.1);
  --own:#0f9a60; --own-soft:rgba(15,154,96,.1);
  --play:#1d74db; --play-soft:rgba(29,116,219,.1);
  --pend:#b87200; --pend-soft:rgba(184,114,0,.11);
  --violet:#7457e0; --star:#e9a100;
  --glow1:rgba(224,38,107,.10); --glow2:rgba(29,116,219,.10); --glow3:rgba(116,87,224,.07);
  --shadow:0 1px 2px rgba(20,23,32,.06),0 12px 28px -16px rgba(20,23,32,.25);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eceef4; --surface:#ffffff; --raised:#ffffff; --sunk:#f3f4f8; --line:#dcdfe8;
  --fg:#141720; --muted:#5d6477;
  --accent:#e0266b; --accent-ink:#ffffff; --accent-soft:rgba(224,38,107,.1);
  --own:#0f9a60; --own-soft:rgba(15,154,96,.1);
  --play:#1d74db; --play-soft:rgba(29,116,219,.1);
  --pend:#b87200; --pend-soft:rgba(184,114,0,.11);
  --violet:#7457e0; --star:#e9a100;
  --glow1:rgba(224,38,107,.10); --glow2:rgba(29,116,219,.10); --glow3:rgba(116,87,224,.07);
  --shadow:0 1px 2px rgba(20,23,32,.06),0 12px 28px -16px rgba(20,23,32,.25);
  color-scheme:light}
*{box-sizing:border-box}
body{background:radial-gradient(900px 420px at 8% -8%,var(--glow1),transparent 70%),radial-gradient(800px 420px at 92% -6%,var(--glow2),transparent 70%),radial-gradient(700px 500px at 50% 110%,var(--glow3),transparent 70%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding-block:26px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(1.55rem,4vw,2.3rem);font-weight:700;line-height:1.1}
h2{font-size:clamp(1.35rem,3.2vw,2rem);font-weight:700;line-height:1.12}
h3{font-size:.95rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--play);outline-offset:2px}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1 .sticker{display:inline-block;font-family:var(--body);font-size:.42em;font-weight:800;vertical-align:.45em;margin-left:.5em;padding:.3em .65em;border-radius:6px;background:var(--holo);background-size:200% 100%;color:#14101c;letter-spacing:.04em;text-transform:uppercase}
.totals{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;padding:8px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:84px}
.chip b{font-family:var(--display);font-size:1.12rem;font-weight:600}
.chip.own b{color:var(--own)}
.chip.wish b{color:var(--accent)}
.headright{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.themebtn{width:44px;height:44px;flex:none;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:1.15rem;line-height:1;display:grid;place-items:center;padding:0}
.themebtn:hover{background:var(--raised);border-color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.themebtn{transition:transform .3s ease}.themebtn:active{transform:rotate(40deg) scale(.92)}}
.status{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.status.warn{color:var(--accent);font-weight:700}

/* top nav like a launcher */
.apps{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;max-width:100%;overflow-x:auto}
.appbtn{border:0;background:none;padding:10px 16px 12px;font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;position:relative}
.appbtn:hover{color:var(--fg)}
.appbtn[aria-pressed="true"]{color:var(--fg)}
.appbtn[aria-pressed="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--holo)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.layout.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:780px){.layout{grid-template-columns:minmax(0,1fr);gap:16px}}

/* home */
:root{--cine:#ff6b3d;--anime:#b57bff;--manga:#22d3ee}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--cine:#d4470f;--anime:#7e3fdb;--manga:#0a87a3}}
:root[data-theme="light"]{--cine:#d4470f;--anime:#7e3fdb;--manga:#0a87a3}
body[data-app="media"]{--sec:var(--cine)}
body[data-app="anime"]{--sec:var(--anime)}
body[data-app="manga"]{--sec:var(--manga)}
@media (max-width:620px){.apps{flex-wrap:wrap;overflow:visible}}
.chip.cine b{color:var(--c,var(--sec))}
.tab[data-mtab="watching"]{--tc:var(--sec)}.tab[data-mtab="pending"]{--tc:var(--pend)}.tab[data-mtab="done"]{--tc:var(--own)}
.mcard .pcimg{aspect-ratio:2/3}
.mcard.st-watching .pcimg{box-shadow:0 0 0 2px var(--sec),0 12px 26px -12px var(--sec)}
.badge.watching{background:var(--sec);color:var(--on-color)}
.acts .watch{background:var(--sec);color:var(--on-color);border-color:transparent}
.chiprow{display:flex;gap:5px;flex-wrap:wrap}
.eprow{display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:700;font-size:.85rem;color:var(--sec)}
.epbtn{border:1px solid var(--sec);background:transparent;color:var(--sec);border-radius:6px;padding:2px 8px;font-size:.75rem;font-weight:800}
.epbtn:hover{background:var(--sec);color:var(--on-color)}
.eprow{flex-wrap:wrap;row-gap:4px}.eprow .epl{white-space:nowrap}.epbtn{white-space:nowrap}
.eprow.full{color:var(--own)}
.eprow.full .epbtn{border-color:var(--own);color:var(--own)}
.eprow.full .epbtn:hover{background:var(--own);color:#08170f}
.epbar{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:4px}
.epbar span{display:block;height:100%;background:var(--sec);border-radius:999px}
.eprow.full+.epbar span{background:var(--own)}
.nowg.nowm .cv{box-shadow:0 0 0 2px var(--c),0 10px 22px -10px var(--c);aspect-ratio:2/3;width:86px}
.nowg.nowm{width:86px}
@media (max-width:520px){.appbtn{padding:10px 8px 12px;font-size:.72rem;letter-spacing:.03em}.appbtn .lg{display:none}.tabs{flex-wrap:wrap;overflow:visible}.tab{padding:10px 8px 12px;font-size:.9rem}}
@media (prefers-reduced-motion:no-preference){.mcard.st-watching:hover .pcimg{box-shadow:0 0 0 2px var(--sec),0 18px 34px -12px var(--sec)}}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
@media (max-width:780px){.home{grid-template-columns:minmax(0,1fr)}}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.hbody{padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.hbody .btn{align-self:flex-start;margin-top:auto}
.hbody .meta{margin:0;font-size:.88rem;color:var(--muted)}
.avs{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.hav{width:52px;height:52px;border-radius:50%;padding:0;border:0;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c);background:var(--raised);font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--c);display:grid;place-items:center}
.hav img{width:100%;height:100%;object-fit:cover;display:block}
.more{align-self:center;font-weight:700;color:var(--fg);opacity:.75}
.nowrow{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 6px}
.nowg{flex:none;width:92px;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.nowg .cv{width:92px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;box-shadow:0 0 0 2px var(--play),0 10px 22px -10px var(--play);background:var(--holo);background-size:200% 100%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#14101c}
.nowg .cv img{width:100%;height:100%;object-fit:cover;display:block}
.nowg .t{font-size:.78rem;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.recent{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow)}
.recent ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.recent li+li{border-top:1px solid var(--line)}
.rbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 8px;border-radius:8px}
.rbtn:hover{background:var(--raised)}
.rth{width:42px;height:42px;border-radius:6px;overflow:hidden;flex:none;background:var(--holo);background-size:200% 100%;display:grid;place-items:center;font-size:.75rem;font-weight:800;font-family:var(--display);color:#14101c}
.rth img{width:100%;height:100%;object-fit:cover;display:block}
.rtx{flex:1;min-width:0;display:flex;flex-direction:column}
.rtx b{font-weight:600;overflow-wrap:anywhere}
.rtx small{color:var(--muted)}
.rwhen{font-size:.78rem;color:var(--muted);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.hav,.nowg .cv{transition:transform .2s ease}.hav:hover,.nowg:hover .cv{transform:scale(1.06)}}

/* games specifics */
.chip.done b{color:var(--own)}.chip.play b{color:var(--play)}.chip.pend b{color:var(--pend)}
.gsub{margin:6px 0 12px;color:var(--fg);opacity:.85;font-weight:600}
.gprog{height:8px;border-radius:999px;background:rgba(127,127,127,.25);overflow:hidden;max-width:440px}
.gprog span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--own),var(--play))}
.gcard .pcimg .ph{font-size:1.4rem;padding:8px;text-align:center}
.gcard.st-done .pcimg{padding:2px;background:var(--holo)}
.gcard.st-done .pcimg img,.gcard.st-done .pcimg .ph{border-radius:6px}
.gcard.st-playing .pcimg{box-shadow:0 0 0 2px var(--play),0 12px 26px -12px var(--play)}
.gcard.st-pending .pcimg img{filter:grayscale(.75) brightness(.85)}
.gcard.st-pending:hover .pcimg img{filter:none}
.badge.done{background:var(--own);color:#0c1a13}
.badge.playing{background:var(--play);color:#0a1422}
.badge.pending{background:var(--pend);color:#1f1300}
.plat{align-self:flex-start;font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;border-radius:4px;background:var(--raised);border:1px solid var(--line);color:var(--muted);margin-top:3px}
.stars{display:flex;gap:1px;margin-top:3px}
.star{background:none;border:0;padding:0 1px;font-size:1.1rem;line-height:1;color:var(--line)}
.star.on{color:var(--star)}
button.star:hover{transform:scale(1.15)}

/* group rail = library sidebar */
.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.rail>.label{padding:6px 10px 6px}
@media (max-width:780px){.rail{position:static;flex-direction:row;align-items:flex-start;overflow-x:auto;padding:8px;scrollbar-width:thin}.rail>.label{display:none}.rail .gbtn{align-self:flex-start}}
.gbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;white-space:nowrap;color:var(--muted)}
.gbtn:hover{background:var(--raised);color:var(--fg)}
.gbtn[aria-current="true"]{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--fg)}
@media (max-width:780px){.gbtn{width:auto;flex:none}}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--c,var(--line));background:var(--raised);display:grid;place-items:center;font-family:var(--display);font-size:.68rem;font-weight:700;color:var(--c)}
.gname{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.gcount{font-size:.72rem;color:var(--muted);background:var(--sunk);border-radius:4px;padding:1px 7px}
.addgroup{margin-top:8px;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--sunk)}
.addwrap{margin-top:8px}.addwrap>summary{list-style:none;cursor:pointer;padding:8px 10px;border-radius:8px;font-weight:700;color:var(--muted);border:1px dashed var(--line)}.addwrap>summary::-webkit-details-marker{display:none}.addwrap>summary:hover{color:var(--fg);border-color:var(--muted)}.addwrap[open]>summary{margin-bottom:8px;color:var(--fg)}.addwrap .addgroup{margin-top:0}
@media (max-width:780px){.rail{flex-wrap:wrap;overflow:visible}.addwrap{flex:1 1 100%;margin-top:4px}}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(24px,1fr));gap:7px;justify-items:center}
.sw{width:24px;height:24px}
.swc{position:relative;width:24px;height:24px;border-radius:50%;border:1px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:.95rem;line-height:1;cursor:pointer;overflow:hidden;background:var(--cc,transparent)}
.swc.on{border:2px solid var(--surface);box-shadow:0 0 0 2px var(--fg);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.swc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.swhint{font-size:.72rem;color:var(--muted)}
.gedit{display:flex;flex-direction:column;gap:10px;max-width:440px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);padding:14px;border-radius:10px;border:1px solid var(--line)}
.gedit label{display:flex;flex-direction:column;gap:4px}
.gedit .editacts{display:flex;gap:8px;flex-wrap:wrap}
.filelab{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:600}
.filelab input{font-size:.78rem;max-width:100%}

input[type=text],input[type=number],select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
input::placeholder{color:var(--muted);opacity:.8}
input:focus,select:focus,textarea:focus{border-color:var(--play);outline:none;box-shadow:0 0 0 3px var(--play-soft)}
.btn{border:0;border-radius:8px;padding:9px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px -10px var(--accent)}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--raised);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:.85rem}

/* page + hero banner */
.page{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.banner{position:relative;overflow:hidden;padding:30px 26px 22px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 55%,transparent),transparent 60%),radial-gradient(90% 120% at 100% 0%,color-mix(in srgb,var(--violet) 30%,transparent),transparent 65%),var(--raised)}
.banner::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 0%,color-mix(in srgb,var(--surface) 55%,transparent) 55%,var(--surface) 100%)}
.banner .bg{position:absolute;inset:-30px;z-index:-2;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(22px) saturate(1.35);opacity:.8}
.hcard .banner{min-height:150px}
.bannerrow{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}

async function replacePcPhoto(id,file){
  if(!file||!S.assets||!S.db)return;

  S.uploading="i:"+id;render();status("Subiendo foto…");

async function shrink(file){
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,640/Math.min(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",.85));
}
async function setPhoto(gid,file){
  if(!file||!S.assets||!S.db)return;
  if(!file.type.startsWith("image/")){status("Elige un archivo de imagen (JPG, PNG, WEBP…).",true);return;}
  S.uploading=gid;render();status("Subiendo foto…");
  try{
    let b;try{b=await shrink(file);}catch(e){b=file;}
    const r=await S.assets.upload(b,{type:b.type||"image/jpeg"});
    const old=(S.groups.find(g=>g.id===gid)||{}).photo;
    await S.db.doc("groups/"+gid).update({photo:r.id});
    if(old&&old!==r.id)S.assets.delete(old).catch(()=>{});
    status("");
  }catch(e){
    const c=e&&e.code;
    status(c==="quota_exceeded"||c==="too_large"?"La foto es demasiado grande o no queda espacio. Prueba con otra imagen.":c==="invalid_request"?"Ese formato de imagen no se puede usar. Prueba con JPG o PNG.":"No se pudo subir la foto. Inténtalo de nuevo.",true);
  }finally{S.uploading=null;render();}
}
async function removePhoto(gid){
  const g=S.groups.find(x=>x.id===gid);if(!g||!g.photo||!S.db)return;
  const old=g.photo;
  await write(()=>S.db.doc("groups/"+gid).update({photo:null}));
  if(S.assets)S.assets.delete(old).catch(()=>{});
}

            ${edit?`<button class="link" data-act="pickphoto">${g.photo?"Cambiar foto":"Añadir foto"}</button>${g.photo?`<button class="link" data-act="rmphoto">Quitar foto</button>`:""}`:""}
            ${conf==="g:"+g.id?`<span class="confirm">¿Borrar el grupo y sus ${s.own+s.wish} cosas? <button class="btn sm" data-act="delgroup">Sí, borrar</button><button class="btn sm ghost" data-act="cancel">Cancelar</button></span>`:`<button class="link danger" data-act="askgroup">Borrar grupo</button>`}
          </div>`:""}
        </div>
      </div>
    </div>
    <div class="sections">
      <button class="secbtn" data-sec="merch" aria-pressed="${!pcSec}"><span class="ic">💿</span>Álbumes y merch<span class="pill num">${nM}</span></button>

        <label><span class="label">Versión</span><input type="text" id="iVer" placeholder="Ver. A, Digipack…" maxlength="60"></label>

        <button class="btn" type="submit" ${S.pcBusy?"disabled":""}>${S.pcBusy?"Subiendo…":"Añadir"}</button>

      ${pcSec&&members.length?`<div class="mchips" aria-label="Filtrar por miembro"><button class="mchip" data-m="" aria-pressed="${!S.member}">Todos</button>${members.map(m=>`<button class="mchip" data-m="${esc(m)}" aria-pressed="${S.member===m}">${esc(m)}</button>`).join("")}</div>`:""}
      ${list.length?`<div class="${pcSec?"pcgrid":"items"}">${list.map(pcSec?pcCard:card).join("")}</div>`:`<div class="empty"><span class="sleeve"></span><h3>${q||S.member&&pcSec?"Nada coincide con el filtro":pcSec?(own?"Aún no tienes photocards apuntadas":"No hay photocards en tu lista de deseos"):own?"Aún no has apuntado nada que tengas":"Tu lista de deseos está vacía"}</h3><p>${q||S.member&&pcSec?"Prueba con otra palabra o elige «Todos».":pcSec?"Sube la foto de la photocard arriba, con el miembro y el álbum.":own?"Añádelo arriba o marca algo de «Quiero» como ¡Conseguido!":"Apunta arriba el próximo álbum o merch que quieras de "+esc(g.name)+"."}</p></div>`}
    </div>
  </section>`);
}

function card(i){
  const own=i.status==="own",c=S.confirm==="i:"+i.id;
  const meta=[i.version,i.notes].filter(Boolean).map(esc).join(" · ");
  const up=S.uploading==="i:"+i.id,ed=S.canWrite&&S.assets;
  const pic=up?`<span class="ph">Subiendo…</span>`:i.photo?`<img src="${blob(i.photo)}" alt="${esc(i.name)}" loading="lazy">`:"";
  return `<article class="card ${own?"own":"wish"}">
    ${pic?(ed?`<button class="cimg" data-act="pcphoto" data-i="${i.id}" aria-label="Cambiar foto">${pic}</button>`:`<div class="cimg">${pic}</div>`):""}
    ${S.canWrite&&S.editing===i.id?editForm(i):`<div class="top"><span class="kind">${esc(i.kind)}</span>${+i.price?`<span class="price num">${eur(i.price)}</span>`:""}</div>
    <span class="title">${esc(i.name)}</span>
    ${meta?`<span class="meta">${meta}</span>`:""}
    ${S.canWrite?acts(i,ed&&!i.photo&&!up):""}`}
  </article>`;
}

function status(msg,warn){const el=$("#status");el.textContent=msg||"";el.hidden=!msg;el.classList.toggle("warn",!!warn);}
async function write(fn){
  try{await fn();}catch(e){
    if(e&&e.code==="invalid_argument"){S.canWrite=false;render();status("No tienes permiso para editar esta colección.",true);}
    else if(e&&e.code==="quota_exceeded")status("La colección está llena: borra algunas cosas para añadir más.",true);
    else status("No se pudo guardar. Revisa la conexión e inténtalo de nuevo.",true);
  }
}

document.addEventListener("submit",e=>{
  e.preventDefault();const db=S.db;if(!db)return;
  if(e.target.id==="fGroup"){
    const name=$("#gName").value.trim();if(!name)return;
    const ref=db.collection("groups").doc();S.sel=ref.id;
    const pf=$("#gPhoto")&&$("#gPhoto").files[0];
    write(async()=>{await ref.set({name,color:S.color,createdAt:Date.now()});if(pf)await setPhoto(ref.id,pf);});
  }
  if(e.target.dataset&&e.target.dataset.edit){
    const id=e.target.dataset.edit,it=S.items.find(x=>x.id===id);if(!it)return;
    const v=k=>{const el=document.getElementById(k);return el?el.value.trim():"";};
    const upd={name:v("eName")||(isPc(it)?"":it.name),version:v("eVer"),price:Math.max(0,parseFloat(v("ePrice"))||0),notes:v("eNotes")};
    if(isPc(it))upd.member=v("eMember");else upd.kind=v("eKind")||it.kind;
    S.editing=null;document.querySelectorAll(".editf").forEach(f=>f.remove());render();
    write(()=>db.doc("items/"+id).update(upd));

  }
  if(e.target.dataset&&e.target.dataset.grp){

    if(!name){status("Escribe un nombre para el grupo.",true);return;}
    const color=S.gcolor;S.gedit=null;$("#main").innerHTML="";render();
    write(()=>db.doc("groups/"+id).update({name,color}));
    return;
  }
  if(e.target.dataset&&e.target.dataset.gedit){
    const id=e.target.dataset.gedit,g=S.games.find(x=>x.id===id);if(!g)return;

    write(()=>db.doc("games/"+id).update(upd));

  }
  if(e.target.dataset&&e.target.dataset.medit){
    const C=curShelf();if(!C)return;
    const id=e.target.dataset.medit,m=S[C.col].find(x=>x.id===id);if(!m)return;

    const type=v("meType")||m.type||C.defType;
    const upd={title:v("meTitle")||m.title,type,platform:v("mePlat"),notes:v("meNotes")};

    S.editing=null;S.meType=null;document.querySelectorAll(".editf").forEach(f=>f.remove());render();
    write(()=>db.doc(C.col+"/"+id).update(upd));

    const file=S.pcFile;S.pcBusy=true;render();

      try{
        if(file&&S.assets){status("Subiendo "+C.poster.toLowerCase()+"…");let b;try{b=await shrink(file)}catch(_){b=file}const r=await S.assets.upload(b,{type:b.type||"image/jpeg"});data.photo=r.id;}
        await db.collection(C.col).doc().set(data);
        clearPc();["mTitle","mPlat","mNotes","mSeason","mEp","mEps"].forEach(k=>{const el=document.getElementById(k);if(el)el.value="";});
        status("");
      }catch(err){if(data.photo&&S.assets)S.assets.delete(data.photo).catch(()=>{});status(upErr(err),true);}
      finally{S.pcBusy=false;render();}
    })();
    return;
  }
  if(e.target.id==="fGame"){
    if(S.pcBusy)return;
    const title=$("#nTitle").value.trim();if(!title)return;
    const now=Date.now();
    const data={title,platform:$("#nPlat").value.trim(),notes:$("#nNotes").value.trim(),status:S.gtab,rating:0,createdAt:now};
    if(S.gtab==="playing")data.startedAt=now;if(S.gtab==="done")data.finishedAt=now;
    const file=S.pcFile;S.pcBusy=true;render();
    (async()=>{
      try{
        if(file&&S.assets){status("Subiendo portada…");let b;try{b=await shrink(file)}catch(_){b=file}const r=await S.assets.upload(b,{type:b.type||"image/jpeg"});data.photo=r.id;}
        await db.collection("games").doc().set(data);
        clearPc();["nTitle","nPlat","nNotes"].forEach(k=>{const el=document.getElementById(k);if(el)el.value="";});
        status("");
      }catch(err){if(data.photo&&S.assets)S.assets.delete(data.photo).catch(()=>{});status(upErr(err),true);}
      finally{S.pcBusy=false;render();}
    })();
    return;
  }
  if(e.target.id==="fPc"){
    if(S.pcBusy)return;
    const member=$("#pMember").value.trim(),name=$("#pName").value.trim();
    if(!member&&!name&&!S.pcFile){status("Añade al menos la foto, el miembro o el álbum.",true);return;}
    const data={groupId:S.sel,kind:"Photocard",member,name,version:$("#pVer").value.trim(),price:Math.max(0,parseFloat($("#pPrice").value)||0),notes:$("#pNotes").value.trim(),status:S.tab,createdAt:Date.now()};
    const file=S.pcFile;S.pcBusy=true;render();
    (async()=>{
      try{
        if(file&&S.assets){status("Subiendo photocard…");let b;try{b=await shrink(file)}catch(_){b=file}const r=await S.assets.upload(b,{type:b.type||"image/jpeg"});data.photo=r.id;}
        await db.collection("items").doc().set(data);
        clearPc();["pMember","pName","pVer","pPrice","pNotes"].forEach(k=>{const el=document.getElementById(k);if(el)el.value="";});
        status("");
      }catch(err){if(data.photo&&S.assets)S.assets.delete(data.photo).catch(()=>{});status(upErr(err),true);}
      finally{S.pcBusy=false;render();}
    })();
  }
  if(e.target.id==="fItem"){
    if(S.pcBusy)return;
    const name=$("#iName").value.trim();if(!name)return;
    const data={groupId:S.sel,name,kind:$("#iKind").value,version:$("#iVer").value.trim(),price:Math.max(0,parseFloat($("#iPrice").value)||0),notes:$("#iNotes").value.trim(),status:S.tab,createdAt:Date.now()};
    const file=S.pcFile;
    if(!file){
      write(()=>db.collection("items").doc().set(data));
      ["iName","iVer","iPrice","iNotes"].forEach(k=>{const el=document.getElementById(k);if(el)el.value="";});
      setTimeout(()=>$("#iName")&&$("#iName").focus(),0);
    }else{
      S.pcBusy=true;render();
      (async()=>{
        try{
          if(S.assets){status("Subiendo foto…");let b;try{b=await shrink(file)}catch(_){b=file}const r=await S.assets.upload(b,{type:b.type||"image/jpeg"});data.photo=r.id;}
          await db.collection("items").doc().set(data);
          clearPc();["iName","iVer","iPrice","iNotes"].forEach(k=>{const el=document.getElementById(k);if(el)el.value="";});
          status("");
        }catch(err){if(data.photo&&S.assets)S.assets.delete(data.photo).catch(()=>{});status(upErr(err),true);}
        finally{S.pcBusy=false;render();}
      })();
    }
  }
});
document.addEventListener("toggle",e=>{if(e.target&&e.target.id==="addWrap")S.addOpen=e.target.open;},true);
document.addEventListener("change",e=>{
  if(e.target.id==="photoIn"&&S.sel)setPhoto(S.sel,e.target.files[0]);
  if(e.target.id==="mType"&&S.shs[S.app]){S.shs[S.app].form=e.target.value;render();return;}
  if(e.target.id==="meType"){S.meType=e.target.value;render();return;}
  if(e.target.id==="pcFile"){const f=e.target.files[0];if(!f)return;
    if(S.pcTarget){const id=S.pcTarget;S.pcTarget=null;replacePcPhoto(id,f);return;}
    if(!f.type.startsWith("image/")){status("Elige un archivo de imagen (JPG, PNG, WEBP…).",true);return;}
    clearPc();S.pcFile=f;try{S.pcPrev=URL.createObjectURL(f);}catch(_){}render();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="grColor"){S.gcolor=e.target.value;document.querySelectorAll(".gedit .sw").forEach(x=>x.setAttribute("aria-pressed","false"));const sc=e.target.parentElement;sc.classList.add("on");sc.style.setProperty("--cc",S.gcolor);return;}
  if(e.target.id==="gColor"){S.color=e.target.value;document.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed","false"));const sc=e.target.parentElement;sc.classList.add("on");sc.style.setProperty("--cc",S.color);return;}
  if(e.target.id==="mq"&&S.shs[S.app]){S.shs[S.app].q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#mq");q.focus();q.setSelectionRange(pos,pos);return;}
  if(e.target.id==="gq"){S.gq=e.target.value;const pos=e.target.selectionStart;render();const q=$("#gq");q.focus();q.setSelectionRange(pos,pos);return;}
  if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos);}
});

render();syncThemeBtn();
(async()=>{
  const db=await window.claude?.use?.("db");
  if(!db){status("Abre esta página en claude.ai con tu sesión iniciada para guardar tu colección.",true);S.ready=true;render();return;}
  S.db=db;
  const user=await window.claude.use("user");
  S.canWrite=user?user.isOwner():true;
  try{S.assets=await window.claude.use("assets");}catch(e){S.assets=null;}
  let got={g:false,i:false};
  const timer=setTimeout(()=>status("No se puede conectar con tu colección todavía. Puede que lo que ves no esté al día.",true),10000);
  const done=()=>{if(got.g&&got.i){clearTimeout(timer);status("");}};
  const fail=()=>{clearTimeout(timer);status("Se perdió la conexión con la colección. Recarga la página.",true);};
  db.collection("groups").onSnapshot(s=>{S.groups=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache){got.g=true;S.ready=true;done();}render();},fail);
  ["media","anime","manga"].forEach(k=>db.collection(k).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render();},fail));
  db.collection("games").onSnapshot(s=>{S.games=s.docs.map(d=>({id:d.id,...d.data()}));render();},fail);
  db.collection("items").onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache){got.i=true;done();}render();},fail);
})();
</script>
